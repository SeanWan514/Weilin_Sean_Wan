<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">StateDelta — grounding instructions in assembly state changes</title>
  <desc id="desc">A conceptual furniture-assembly example. Separate structural parts on the left become an assembled frame on the right. Rose highlights connect the changed attachment to visual evidence and an instruction record. This illustrates the research approach, not a dataset example or experimental result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a63d5d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#eee6e3" stroke-width="1"/></pattern>
  </defs>
  <rect width="720" height="460" rx="20" fill="#fcf9f7"/>
  <rect x="28" y="28" width="664" height="286" rx="16" fill="url(#paper)"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#303039" font-size="28">
    <text x="142" y="68" text-anchor="middle">Before</text>
    <text x="538" y="68" text-anchor="middle">After</text>
  </g>
  <g stroke="#5e636a" stroke-width="3" stroke-linejoin="round">
