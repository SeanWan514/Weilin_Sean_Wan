    <rect x="-16" y="-13" width="88" height="94" rx="8" fill="#e7efec" transform="rotate(-10)"/>
    <rect x="0" y="0" width="88" height="94" rx="8" fill="#fff" stroke="#82a7a1" stroke-width="2.5"/>
    <circle cx="44" cy="47" r="25" fill="#d5e4df"/>
    <path d="M44 22V47L64 62A25 25 0 0 0 44 22Z" fill="#548c83"/>
  </g>
  <g transform="translate(568 259)">
    <rect x="-16" y="-13" width="88" height="94" rx="8" fill="#f4dce4" transform="rotate(10)"/>
    <rect x="0" y="0" width="88" height="94" rx="8" fill="#fff" stroke="#bc8b9d" stroke-width="2.5"/>
    <circle cx="44" cy="47" r="25" fill="#efd1dd"/>
    <path d="M44 22V47L24 62A25 25 0 0 1 44 22Z" fill="#b55b7b"/>
