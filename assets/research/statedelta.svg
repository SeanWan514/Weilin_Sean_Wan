    <path d="M244 216 260 209 260 286 244 293Z" fill="#e8e9e7"/>
    <path d="M460 154V252L476 259V162Z" fill="#cddcdb"/>
    <path d="M558 123V222L574 229V131Z" fill="#bfd1d0"/>
    <path d="M508 180V279L524 286V188Z" fill="#d9e5e3"/>
    <path d="M606 149V248L622 255V157Z" fill="#cddcdb"/>
    <path d="M446 139 554 104 634 140 526 177Z" fill="#f2d7df" stroke="#a63d5d"/>
